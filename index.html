*{box-sizing:border-box}
body,button,input,select{font-family:"RB",Tahoma,sans-serif!important;font-synthesis:none}
body{margin:0;color:var(--ink);background:radial-gradient(1000px 500px at 85% -10%,rgba(38,208,206,.22),transparent),var(--navy);min-height:100vh}
header{display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:170px;height:56px;background:var(--logo) center/contain no-repeat}
header h1{margin:0;font-size:22px;color:var(--teal2);flex:1}
.tools button,.tabs button,.btn{font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:14px 28px;flex-wrap:wrap}
.tabs button.on,.btn.p{background:var(--teal);color:var(--navy);font-weight:700;border-color:var(--teal)}
.tools button:hover,.tabs button:hover,.btn:hover{border-color:var(--teal)}
main{padding:6px 28px 60px;max-width:1300px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 4px;color:var(--teal2);font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input,select{background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
input:focus,select:focus{outline:2px solid var(--teal)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}
.mem{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.mem input{flex:1;min-width:0}
.x{background:none;border:0;color:#ff7b7b;cursor:pointer;font-size:18px}
.head{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--teal2)}
tr.done td.t{text-decoration:line-through;color:var(--mute)}
.pts{color:var(--teal);font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2))}
h2{color:var(--teal);font-size:19px;margin:22px 0 8px}
.medal{font-size:20px}
.empty{color:var(--mute);padding:10px}

td input[type=text],td input:not([type]),td input[type=date]{width:100%}
.star{background:linear-gradient(135deg,rgba(38,208,206,.25),rgba(255,255,255,.03));border:1px solid var(--teal);border-radius:18px;padding:18px 22px;display:flex;gap:16px;align-items:center;flex:1;min-width:260px}
.star .tr{font-size:46px}.star b{font-size:22px;color:var(--teal2);display:block}.star small{display:block}

.tcol .tbx{width:100%;background:rgba(255,255,255,.08);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;min-height:3px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--teal);color:var(--navy);font-weight:700;padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99}#toast.show{opacity:1}
.code{direction:ltr;text-align:left;display:inline-block;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:monospace!important;color:var(--teal2)}
ol.st{padding-inline-start:20px;line-height:2}
details.dd{position:relative;display:inline-block;min-width:150px}
details.dd summary{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;list-style:none}
details.dd .ddm{position:absolute;z-index:30;top:100%;right:0;background:#102a31;border:1px solid var(--teal);border-radius:10px;padding:8px;max-height:260px;overflow:auto;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ddm label{display:flex;gap:8px;align-items:center;padding:4px 2px;cursor:pointer;font-size:14px}.ddm .btn{width:100%;margin-bottom:6px;padding:5px 8px;font-size:13px}
details.card summary{cursor:pointer;color:var(--teal2);font-weight:700}

#login .card{width:min(400px,100%);text-align:center}#login input{width:100%;margin:6px 0}#login .logo{margin:0 auto 10px}#lerr{color:#ff9a9a;min-height:20px;font-size:14px}

<body>
<header>
  <div class="logo"></div>
  <h1>إدارة مهام اللجان</h1>
  <div class="tools">
    <span id="who" class="head"></span><span id="sync" class="head"></span><button id="bOut" hidden>خروج</button>
    <button id="bXls">📊 تصدير Excel</button>
    <button id="bExp">⬇ تنزيل ملف</button>
    <button id="bImp">⬆ رفع ملف</button>
    <button id="bPrint">🖨 طباعة</button>
    <input type="file" id="fImp" accept=".json" hidden>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div id="login"><div class="card"><div class="logo"></div><h3 id="lt">أكاديمية روّاد · تسجيل الدخول</h3><div id="lform"><input id="lnm" placeholder="الاسم الكامل (عند إنشاء حساب جديد)"><input id="lem" type="email" dir="ltr" placeholder="البريد الإلكتروني"><input id="lpw" type="password" dir="ltr" placeholder="كلمة المرور (٦ أحرف على الأقل)"><div id="lerr"></div><div class="row" style="justify-content:center"><button class="btn p" id="bLog">دخول</button><button class="btn" id="bReg">إنشاء حساب جديد</button></div></div><div id="lmsg" class="head"></div><button class="btn" id="bOut2" hidden style="margin-top:10px">تسجيل الخروج</button></div></div>
<div id="toast"></div>
<script>
/* ===== الربط السحابي (Firebase): الصق إعدادات مشروعك هنا لتفعيل الحسابات والبيانات المشتركة. اتركها فارغة للعمل المحلي ===== */
const CLOUD={apiKey:'AIzaSyB-HF23YxVpuIirOrDiDu2OXXIoT6zPNbs',authDomain:'rowad-mtc.firebaseapp.com',databaseURL:'https://rowad-mtc-default-rtdb.firebaseio.com',projectId:'rowad-mtc',appId:'1:179567478235:web:2b143e512683ad2e6a93fe'};
const CLOUDON=!!(CLOUD.databaseURL&&CLOUD.apiKey);
const KEY='rowad-tasks-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRACKS=['مسار ريادة الأعمال','المسار التقني','المسار الهندسي'];
const COMS=['لجنة التخطيط','لجنة العلاقات العامة','لجنة إدارة المحتوى','لجنة التصميم'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=v=>new Date(String(v).slice(0,10)+'T12:00:00');
const monday=v=>{const d=v instanceof Date?new Date(v):D(v);d.setHours(12);d.setDate(d.getDate()-(d.getDay()+1)%7);return iso(d)}; // بداية الأسبوع: السبت
let S;
try{S=CLOUDON?null:JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S) S={tab:'home',bonus:{},fc:'all',week:monday(new Date()),pts:10,
  com:[...COMS.map(n=>({id:uid(),kind:'com',name:n,head:'',members:[]})),...TRACKS.map(n=>({id:uid(),kind:'track',name:n,head:'',members:[]}))],meet:[],tasks:[]};
S.bonus=S.bonus||{};S.com.forEach(c=>c.kind=c.kind||'com');if(!S.com.some(c=>c.kind==='track'))TRACKS.forEach(n=>S.com.push({id:uid(),kind:'track',name:n,head:'',members:[]}));S.fc=S.fc||'all';
const save=()=>{if(!CLOUDON)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSave()};
const cname=id=>(S.com.find(c=>c.id===id)||{}).name||'—';
const people=cid=>{const c=S.com.find(x=>x.id===cid);return c?[c.head,...c.members].filter(Boolean):[]};
const allPeople=()=>[...new Set(S.com.flatMap(c=>[c.head,...c.members]).filter(Boolean))];
const comOpts=(sel)=>S.com.map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('');
const TABS=[['home','الرئيسية'],['dash','لوحة الإنجازات'],['com','اللجان والأعضاء'],['tracks','المسارات'],['week','مهام الأسبوع'],['meet','جدول الاجتماعات'],['pts','لوحة النقاط'],['notif','التنبيهات'],['mail','البريد'],['snaps','النسخ المحفوظة'],['users','المستخدمون']];

function render(){
  NT();ensureRep();if(!tabsOK().includes(S.tab))S.tab='home';
  document.getElementById('tabs').innerHTML=TABS.filter(([k])=>tabsOK().includes(k)).map(([k,t])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${t}</button>`).join('');
  const m=document.getElementById('main');
  m.innerHTML=({home:vHome,users:vUsers,mail:vMail,notif:vNotif,dash:vDash,snaps:vSnaps,com:()=>vCom('com'),tracks:()=>vCom('track'),week:vWeek,meet:vMeet,pts:vPts})[S.tab]();
  lock();save();
}

/* ---- اللجان ---- */
function vCom(k){
  const tr=k==='track';return `<div class="row"><button class="btn p" data-a="addCom" data-k="${k}">＋ إضافة ${tr?'مسار':'لجنة'}</button></div><div class="grid">`+S.com.filter(c=>(c.kind||'com')===k).map(c=>`
  <div class="card"><div class="row"><input data-f="cname" data-id="${c.id}" value="${esc(c.name)}" style="flex:1;font-weight:700;color:var(--teal2)"><button class="x" title="حذف" data-a="delCom" data-id="${c.id}">🗑</button></div>
  <div class="head">${tr?'مشرف المسار':'رئيس اللجنة'}</div>
  <div class="row"><input data-f="chead" data-id="${c.id}" value="${esc(c.head)}" placeholder="${tr?'اسم مشرف المسار':'اسم رئيس اللجنة'}" style="flex:1"></div>
  <div class="head">الأعضاء (${c.members.length})</div>
  ${c.members.map((n,i)=>`<div class="mem"><input data-f="cmem" data-id="${c.id}" data-i="${i}" value="${esc(n)}"><button class="x" data-a="delMem" data-id="${c.id}" data-i="${i}">✕</button></div>`).join('')}
  <div class="row add"><input id="nm-${c.id}" placeholder="اسم عضو جديد" style="flex:1" data-enter="${c.id}"><button class="btn" data-a="addMem" data-id="${c.id}">＋ إضافة</button></div></div>`).join('')+`</div>`;
}

/* ---- مهام الأسبوع ---- */

/* ---- الاجتماعات ---- */

/* ---- النقاط ---- */


const PRI={'عالية':'hi','متوسطة':'mid','منخفضة':'lo'};
const fmtD=d=>d?D(d).toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long'}):'';
function calc(){
  const r={};allPeople().forEach(p=>r[p]={name:p,cnt:0,pts:0,wk:0,bonus:+S.bonus[p]||0});
  S.tasks.filter(t=>t.done).forEach(t=>wsOf(t).forEach(w=>{const o=r[w]=r[w]||{name:w,cnt:0,pts:0,wk:0,bonus:+S.bonus[w]||0};o.cnt++;o.pts+=+t.pts||0;if(t.week===S.week)o.wk+=+t.pts||0}));
  return Object.values(r).map(o=>({...o,tot:o.pts+o.bonus,coms:S.com.filter(c=>c.head===o.name||c.members.includes(o.name)).map(c=>c.name).join('، ')})).sort((a,b)=>b.tot-a.tot);
}
function vHome(){
  const wk=S.tasks.filter(t=>t.week===S.week),dn=wk.filter(t=>t.done).length,today=iso(new Date());
  const late=S.tasks.filter(t=>!t.done&&t.due&&t.due<today).length;
  const nx=S.meet.filter(m=>m.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  const top=calc().filter(p=>p.tot>0).slice(0,3);
  return `<div class="kpis"><div class="kpi"><b>${wk.length}</b><span>مهام هذا الأسبوع</span></div><div class="kpi"><b>${dn}</b><span>منجزة</span></div>
  <div class="kpi"><b>${wk.length?Math.round(dn/wk.length*100):0}%</b><span>نسبة الإنجاز</span></div><div class="kpi"><b class="late">${late}</b><span>مهام متأخرة</span></div>
  <div class="kpi"><b style="font-size:16px">${nx?esc(nx.topic||'اجتماع'):'—'}</b><span>${nx?fmtD(nx.date)+' '+esc(nx.time):'لا يوجد اجتماع قادم'}</span></div></div>
  <h2>تقدّم اللجان والمسارات هذا الأسبوع</h2><div class="grid">`+S.com.map(c=>{const a=wk.filter(x=>x.com===c.id),d=a.filter(x=>x.done).length;return `<div class="card"><h3>${esc(c.name)}</h3><small>${c.kind==='track'?'المشرف':'الرئيس'}: ${esc(c.head)||'—'} · ${c.members.length} عضو</small><div class="row"><div class="bar" style="flex:1"><i style="width:${a.length?d/a.length*100:0}%"></i></div><span class="pts">${d}/${a.length}</span></div></div>`}).join('')+`</div>
  <h2>الأعلى نقاطًا</h2>`+(top.length?top.map((p,i)=>`<div class="card" style="margin:6px 0"><span class="medal">${['🥇','🥈','🥉'][i]}</span> ${esc(p.name)} <span class="pts" style="float:left">${p.tot} نقطة</span></div>`).join(''):'<div class="empty">ستظهر هنا بعد إنجاز المهام</div>');
}
function vWeek(){
  const w=S.week,end=D(w);end.setDate(end.getDate()+6);const today=iso(new Date());
  const fm=d=>D(d).toLocaleDateString('ar-SA',{day:'numeric',month:'long'});
  const all=S.tasks.filter(t=>t.week===w),dn=all.filter(t=>t.done).length;
  return `<div class="row"><button class="btn" data-a="wk" data-d="-7">▶ السابق</button><input type="date" data-f="week" value="${w}"><button class="btn" data-a="wk" data-d="7">التالي ◀</button>
   <span class="head">${fm(w)} – ${fm(end)}</span><button class="btn" data-a="report" title="ينسخ ملخصًا جاهزًا للصق في واتساب">📋 نسخ تقرير الأسبوع</button><button class="btn" data-a="carry" title="ينقل المهام غير المنجزة للأسبوع التالي">↪ ترحيل غير المنجز</button>
   <span class="pts" style="margin-inline-start:auto">أُنجز ${dn} من ${all.length}</span></div>
  <div class="card add"><div class="row"><select id="tc">${comOpts()}</select><input id="tt" placeholder="عنوان المهمة" style="flex:1;min-width:180px">
   ${msel([],allPeople(),'id="tw"','<button type="button" class="btn" data-a="pickCom">أعضاء اللجنة المختارة</button><button type="button" class="btn" data-a="pickNone">إلغاء التحديد</button>')}
   <select id="tr"><option>متوسطة</option><option>عالية</option><option>منخفضة</option></select><input id="td" type="date" title="آخر موعد">
   <input id="tp" type="number" min="1" value="${S.pts}" style="width:75px" title="النقاط"><input id="tn" placeholder="ملاحظة (اختياري)" style="width:160px"><label class="sw" title="تتكرر المهمة تلقائيًا كل أسبوع"><input type="checkbox" id="trp"><label for="trp">🔁 أسبوعيًا</label></label><button class="btn p" data-a="addTask">＋ إضافة</button></div></div>
  <div class="row"><label>عرض:</label><select data-f="fc"><option value="all">كل اللجان</option>${comOpts(S.fc)}</select><select data-f="fp"><option value="">كل الأشخاص</option>${allPeople().map(p=>`<option${p===S.fp?' selected':''}>${esc(p)}</option>`).join('')}</select></div>`
  +S.com.filter(c=>S.fc==='all'||c.id===S.fc).map(c=>{const ts=all.filter(t=>t.com===c.id&&(!S.fp||wsOf(t).includes(S.fp)));return `<h2>${esc(c.name)}</h2>`+(ts.length?`<table><tr><th>✓</th><th>المهمة</th><th>المسؤول</th><th>الأولوية</th><th>الموعد</th><th>النقاط</th><th></th></tr>`+ts.map(t=>`<tr class="${t.done?'done':''}"><td><input type="checkbox" data-f="done" data-id="${t.id}" ${t.done?'checked':''} ${ROLE==='member'&&!wsOf(t).includes(ME.name)?'disabled':''}></td><td class="t">${t.rep?'🔁 ':''}${esc(t.title)}${t.note?`<small>${esc(t.note)}</small>`:''}</td>
   <td>${msel(wsOf(t),[...new Set([...allPeople(),...wsOf(t)])],'data-id="'+t.id+'"')}</td>
   <td><select data-f="tpri" data-id="${t.id}" class="${PRI[t.pri]||''}">${Object.keys(PRI).map(p=>`<option${p===t.pri?' selected':''}>${p}</option>`).join('')}</select></td>
   <td><input type="date" data-f="tdue" data-id="${t.id}" value="${t.due||''}" class="${!t.done&&t.due&&t.due<today?'late':''}"></td>
   <td><input type="number" min="0" value="${t.pts}" data-f="tpts" data-id="${t.id}" style="width:70px"></td><td style="white-space:nowrap">${wsOf(t).length?`<button class="x" style="color:var(--teal)" data-a="mailTask" data-id="${t.id}" title="إرسال المهمة بالبريد للمسؤولين">✉</button>`:''}<button class="x" data-a="delTask" data-id="${t.id}">🗑</button></td></tr>`).join('')+`</table>`:`<div class="empty">لا توجد مهام لهذا الأسبوع</div>`)}).join('');
}
function vMeet(){
  const ms=[...S.meet].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  return `<div class="card add"><div class="row"><select id="mc"><option value="all">رؤساء اللجان</option>${comOpts()}</select>
   <input id="md" type="date"><input id="mt" type="time"><input id="mp" placeholder="المكان / الرابط" style="width:160px"><input id="mx" placeholder="موضوع الاجتماع" style="flex:1;min-width:170px"><button class="btn p" data-a="addMeet">＋ إضافة اجتماع</button></div></div>`
  +(ms.length?`<table><tr><th>✓</th><th>التاريخ</th><th>الوقت</th><th>اللجنة</th><th>الموضوع</th><th>المكان</th><th>محضر / ملاحظات</th><th></th></tr>`+ms.map(x=>`<tr class="${x.done?'done':''}"><td><input type="checkbox" data-f="mdone" data-id="${x.id}" ${x.done?'checked':''} title="تم عقد الاجتماع"></td><td class="t">${fmtD(x.date)}</td><td>${esc(x.time)}</td><td>${x.com==='all'?'رؤساء اللجان':esc(cname(x.com))}</td><td>${esc(x.topic)}</td><td>${esc(x.place)}</td><td><input data-f="mnote" data-id="${x.id}" value="${esc(x.note)}" placeholder="اكتب هنا"></td><td><button class="x" data-a="delMeet" data-id="${x.id}">🗑</button></td></tr>`).join('')+`</table>`:`<div class="empty">لا توجد اجتماعات مجدولة بعد</div>`);
}
function vPts(){
  const rows=calc(),max=Math.max(1,...rows.map(r=>r.tot));
  return rows.length?`<table><tr><th>#</th><th>الاسم</th><th>اللجنة</th><th>مهام منجزة</th><th>نقاط هذا الأسبوع</th><th>نقاط المهام</th><th>نقاط إضافية</th><th>الإجمالي</th><th></th></tr>`+rows.map((r,i)=>`<tr><td class="medal">${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.name)}</td><td class="head">${esc(r.coms)}</td><td>${r.cnt}</td><td>${r.wk}</td><td>${r.pts}</td><td><input type="number" data-f="bonus" data-p="${esc(r.name)}" value="${r.bonus}" style="width:75px" title="مكافأة أو خصم يدوي"></td><td class="pts">${r.tot}</td><td><div class="bar"><i style="width:${Math.max(0,r.tot)/max*100}%"></i></div></td></tr>`).join('')+`</table>`:`<div class="empty">أضف أعضاء للجان وأنجز مهامًا لتظهر النقاط هنا</div>`;
}

const norm=()=>{S.bonus=S.bonus||{};S.fc=S.fc||'all';S.com.forEach(c=>c.kind=c.kind||'com')};
const SK='rowad-tasks-snaps';
const snaps=()=>{try{return JSON.parse(localStorage.getItem(SK))||[]}catch(e){return[]}};
const putSnaps=a=>{try{localStorage.setItem(SK,JSON.stringify(a))}catch(e){alert('مساحة المتصفح ممتلئة، احذف بعض النسخ القديمة')}};
function snap(name,auto){const a=snaps();a.unshift({id:uid(),name,auto:!!auto,ts:Date.now(),data:JSON.stringify(S)});
  while(a.length>40){const i=a.map(x=>x.auto).lastIndexOf(true);a.splice(i>=0?i:a.length-1,1)}putSnaps(a)}
const dl=(name,txt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click()};
function vSnaps(){
  const a=snaps(),fmt=ts=>new Date(ts).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'});
  return `<div class="card add"><div class="row"><input id="sn" placeholder="اسم النسخة (مثال: نهاية الأسبوع الثالث)" style="flex:1;min-width:200px"><button class="btn p" data-a="snap">💾 حفظ نسخة الآن</button></div>
  <small>تُحفظ نسخة تلقائية مرة كل يوم عند فتح الصفحة، ونسخة قبل أي استرجاع أو رفع ملف. النسخ محفوظة في هذا المتصفح؛ لنقلها لجهاز آخر استخدم زر ⬇ لتنزيل النسخة.</small></div>`
  +(a.length?`<table><tr><th>الاسم</th><th>التاريخ</th><th>المهام</th><th>المنجز</th><th></th></tr>`+a.map(x=>{let d={};try{d=JSON.parse(x.data)}catch(e){}const ts=d.tasks||[];
   return `<tr><td>${x.auto?'🕒':'⭐'} ${esc(x.name)}</td><td>${fmt(x.ts)}</td><td>${ts.length}</td><td>${ts.filter(k=>k.done).length}</td><td style="white-space:nowrap"><button class="btn" data-a="restore" data-id="${x.id}">↩ استرجاع</button> <button class="btn" data-a="dlSnap" data-id="${x.id}" title="تنزيل النسخة">⬇</button> <button class="x" data-a="delSnap" data-id="${x.id}">🗑</button></td></tr>`}).join('')+`</table>`:`<div class="empty">لا توجد نسخ محفوظة بعد</div>`);
}

let FB=null,ROLE='local',ME=null,USERS={},DONE={},synced=false,lastP='',lastV='',wT,regBusy=false,pendQ=[];
const TAB_M=['home','dash','week','meet','pts'];
const tabsOK=()=>ROLE==='member'?TAB_M:ROLE==='head'?TABS.map(x=>x[0]):TABS.map(x=>x[0]).filter(k=>k!=='users');
const typing=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#main')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))};
const later=fn=>typing()?pendQ.push(fn):fn();
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendQ.length&&!typing()){const q=pendQ;pendQ=[];q.forEach(f=>f())}},250));
function ensureTech(){const N='لجنة التقنية والتحول الرقمي';S.com.forEach(c=>{if(c.name==='اللجنة التقنية')c.name=N;if(c.name==='مسار التقنية والتحول الرقمي')c.name='المسار التقني'});if(!S.techAdded){if(!S.com.some(c=>c.kind==='com'&&/التقني/.test(c.name)))S.com.push({id:uid(),kind:'com',name:N,head:'',members:[]});S.techAdded=true}}
function pubStr(){const o={...S};['tab','week','fc','fp','em','mail','nt'].forEach(k=>delete o[k]);o.com=S.com.map(({nt,...c})=>c);return JSON.stringify(o)}
function privStr(){return JSON.stringify({em:S.em,mail:S.mail,nt:S.nt,cnt:Object.fromEntries(S.com.map(c=>[c.id,c.nt]))})}
const stat=m=>{const e=$('sync');if(e)e.textContent=m};
function cloudSave(){
  if(!CLOUDON||ROLE!=='head'||!synced)return;
  clearTimeout(wT);wT=setTimeout(async()=>{
    const p=pubStr(),v=privStr(),{D,db}=FB;
    try{stat('☁ جاري الحفظ…');
      if(p!==lastP){lastP=p;await D.set(D.ref(db,'rowad/data'),{json:p,ts:Date.now(),by:ME.name})}
      if(v!==lastV){lastV=v;await D.set(D.ref(db,'rowad/private'),{json:v})}
      stat('☁ تم الحفظ ✓')}catch(e){stat('⚠ لم يُحفظ');toast('تعذّر الحفظ في السحابة، تحقق من الصلاحيات')}
  },500);
}
function setDone(t){DONE[t.id]=!!t.done;if(FB)FB.D.set(FB.D.ref(FB.db,'rowad/done/'+t.id),!!t.done).catch(()=>toast('لا تملك صلاحية التعديل'))}
const applyDone=()=>S.tasks.forEach(t=>{if(DONE[t.id]!==undefined)t.done=DONE[t.id]});
function applyPub(v,by){
  if(v.json===lastP||v.json===pubStr())return;
  const o=JSON.parse(v.json),keep={tab:S.tab,week:S.week,fc:S.fc,fp:S.fp},em=S.em,mail=S.mail,nt=S.nt,cnt=Object.fromEntries(S.com.map(c=>[c.id,c.nt]));
  S={...o,...keep,em,mail,nt};S.com=(S.com||[]).map(c=>({...c,members:c.members||[],nt:cnt[c.id]}));S.tasks=S.tasks||[];S.meet=S.meet||[];S.bonus=S.bonus||{};
  norm();applyDone();lastP=pubStr();
  if(synced&&ME&&by&&by!==ME.name)toast('تم تحديث البيانات بواسطة '+by);
  render();
}
function applyPriv(v){if(v.json===lastV)return;const o=JSON.parse(v.json);S.em=o.em||{};S.mail=o.mail||S.mail;S.nt=o.nt||S.nt;S.com.forEach(c=>{if((o.cnt||{})[c.id])c.nt=o.cnt[c.id]});lastV=privStr();render()}
function lock(){
  const mem=ROLE==='member',m=$('main');
  ['bImp','bExp'].forEach(i=>{const b=$(i);if(b)b.style.display=mem?'none':''});
  if(!mem)return;

  m.querySelectorAll('input,select,button').forEach(e=>{if(!e.matches('[data-f=done]:not([disabled]),[data-f=week],[data-f=fc],[data-f=fp],[data-a=wk],[data-a=report]'))e.disabled=true});
  m.querySelectorAll('details.dd').forEach(d=>d.style.pointerEvents='none');

function vUsers(){

const errTxt=e=>({'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/invalid-email':'البريد غير صالح','auth/email-already-in-use':'هذا البريد مسجّل مسبقًا','auth/weak-password':'كلمة المرور ضعيفة (٦ أحرف على الأقل)','auth/missing-password':'اكتب كلمة المرور','auth/unauthorized-domain':'النطاق غير مضاف في Firebase Authorized domains','PERMISSION_DENIED':'لا تملك صلاحية'}[e.code]||e.message||'حدث خطأ');
function showMsg(m,out){$('login').style.display='flex';$('lform').style.display='none';$('lmsg').textContent=m;$('bOut2').hidden=!out}

async function afterAuth(u){
  const {D,db}=FB,ref=D.ref(db,'rowad/users/'+u.uid);
  try{
    let rec=(await D.get(ref)).val();

    if(!rec){
      rec={
        name:(u.email||'').split('@')[0],
        email:u.email,
        role:'pending',
        ts:Date.now()
      };
      await D.set(ref,rec);
    }

    ME={uid:u.uid,email:u.email,name:rec.name};

    // فحص بيانات الحساب والصلاحية
    console.log("Firebase user:",u.uid);
    console.log("Database role:",rec.role);

    if(rec.role==='head'||rec.role==='member'){
      ROLE=rec.role;
      startSync();
    }else{
      showMsg(
        rec.role==='blocked'
          ?'تم إيقاف هذا الحساب. تواصل مع الإدارة.'
          :'تم إنشاء حسابك ✓ وهو بانتظار اعتماد رئيس اللجنة. سيُفتح تلقائيًا بعد الاعتماد.',
        true
      );

      D.onValue(ref,s=>{
        const x=s.val();
        if(x&&(x.role==='head'||x.role==='member')){
          location.reload();
        }
      });
    }
  }catch(e){
    showMsg(
      'تعذّر قراءة الحساب: '+errTxt(e)+
      '. تأكد من نشر قواعد الأمان.',
      true
    );
  }
}

function startSync(){
  const {D,db}=FB,R=p=>D.ref(db,'rowad/'+p);let f1=0,f2=0;
  $('login').style.display='none';$('who').textContent=ME.name+' · '+(ROLE==='head'?'رئيس':'عضو');$('bOut').hidden=false;
  if(ROLE==='member'&&!S.fp)S.fp=ME.name;
  const chk=()=>{if(!synced&&f1&&(ROLE!=='head'||f2)){synced=true;if(ROLE==='head'){ensureTech();NT()}render();stat('☁ متصل')}};
  D.onValue(R('done'),s=>{DONE=s.val()||{};applyDone();synced&&later(render)});
  D.onValue(R('data'),s=>{const v=s.val();if(v)later(()=>applyPub(v,v.by));f1=1;chk()},e=>showMsg('لا تملك صلاحية قراءة البيانات',true));
  if(ROLE==='head'){D.onValue(R('private'),s=>{const v=s.val();if(v)later(()=>applyPriv(v));f2=1;chk()});D.onValue(R('users'),s=>{USERS=s.val()||{};if(S.tab==='users')later(render)})}
}
function showLogin(){$('login').style.display='flex';$('lform').style.display='';$('lmsg').textContent='';$('bOut2').hidden=true}
async function cloudBoot(){
  showMsg('جاري الاتصال…');
  try{const B='https://www.gstatic.com/firebasejs/10.12.2/',[A,D,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-database.js'),import(B+'firebase-auth.js')]);
    const app=A.initializeApp(CLOUD);FB={D,U,db:D.getDatabase(app),auth:U.getAuth(app)}}
  catch(e){showMsg('تعذّر الاتصال بالخدمة، تحقق من الإنترنت');return}
  const out=()=>FB.U.signOut(FB.auth).then(()=>location.reload());$('bOut').onclick=out;$('bOut2').onclick=out;
  $('bLog').onclick=async()=>{$('lerr').textContent='';try{await FB.U.signInWithEmailAndPassword(FB.auth,$('lem').value.trim(),$('lpw').value)}catch(e){$('lerr').textContent=errTxt(e)}};
  $('bReg').onclick=async()=>{$('lerr').textContent='';const nm=$('lnm').value.trim();if(!nm)return $('lerr').textContent='اكتب اسمك الكامل أولًا';
    regBusy=true;try{const c=await FB.U.createUserWithEmailAndPassword(FB.auth,$('lem').value.trim(),$('lpw').value);await FB.D.set(FB.D.ref(FB.db,'rowad/users/'+c.user.uid),{name:nm,email:c.user.email,role:'pending',ts:Date.now()});regBusy=false;afterAuth(c.user)}catch(e){regBusy=false;$('lerr').textContent=errTxt(e)}};
  FB.U.onAuthStateChanged(FB.auth,u=>{if(regBusy)return;u?afterAuth(u):showLogin()});
}

  if(a==='mailTest'){const to=$('mtest').value.trim(),m=S.mail;if(!to)return $('mtest').focus();if(!(m.sid&&m.tid&&m.key))return toast('أدخل Service ID و Template ID و Public Key أولًا');sendMail(to,'تجربة',{title:'رسالة تجريبية',com:(S.com[0]||{}).id,pri:'متوسطة',pts:0}).then(ok=>toast(ok?'تم الإرسال ✓ تحقق من بريدك':'تعذّر الإرسال، راجع المفاتيح الثلاثة'));return}

document.addEventListener('change',e=>{
